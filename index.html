<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipQueue — Web Clipboard Queue</title>
  <link rel="icon" href="ClipQueue.ico" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#141622" />
  <style id="cq-styles">
    :root {
      --bg: #0b0e17;
      --shell: rgba(20, 22, 34, 0.94);
      --card: rgba(255, 255, 255, 0.07);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.22);
      --accent-border: rgba(59, 130, 246, 0.65);
      --green: #22c55e;
      --danger: #f87171;
      --text: #f3f5fa;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top right, #172554 0%, var(--bg) 60%);
      color: var(--text);
    }
    body.page-mode {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body.pip-mode {
      background: #141622;
      padding: 0;
      overflow: hidden;
    }
    .app-shell {
      width: 100%;
      max-width: 420px;
      height: 580px;
      max-height: 92vh;
      background: var(--shell);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(14px);
    }
    body.pip-mode .app-shell {
      max-width: none;
      height: 100vh;
      max-height: none;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
    .app-shell.compact {
      height: auto;
      max-height: none;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }
    .count-pill {
      font-size: 11px;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .mini-preview {
      display: none;
      font-size: 12.5px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .app-shell.compact .title,
    .app-shell.compact .count-pill {
      display: none;
    }
    .app-shell.compact .mini-preview {
      display: block;
    }
    .app-shell.compact .body,
    .app-shell.compact .footer,
    .app-shell.compact .add-drawer {
      display: none !important;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      height: 28px;
      min-width: 28px;
      padding: 0 7px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .icon-btn.active {
      background: rgba(59, 130, 246, 0.22);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }

    /* Queue Body */
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .empty {
      margin: auto;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      padding: 24px 16px;
    }
    .card {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 10px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.09);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .card.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
    }
    .card.dragging {
      opacity: 0.4;
    }
    .card-num {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      min-width: 18px;
    }
    .card.active .card-num {
      color: #93c5fd;
    }
    .card-text {
      flex: 1;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .next-badge {
      font-size: 9.5px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      padding: 2px 6px;
      border-radius: 5px;
      flex-shrink: 0;
    }
    .card-actions {
      display: none;
      gap: 4px;
      flex-shrink: 0;
    }
    .card:hover .card-actions {
      display: flex;
    }
    .mini-btn {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .mini-btn:hover { background: rgba(255, 255, 255, 0.24); }
    .mini-btn.del:hover { background: rgba(248, 113, 113, 0.28); color: #fecaca; }

    /* Add / Edit Drawer */
    .add-drawer {
      display: none;
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .add-drawer.open { display: block; }
    .add-drawer textarea {
      width: 100%;
      height: 70px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(11, 14, 23, 0.9);
      color: var(--text);
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    .add-drawer textarea:focus { border-color: var(--accent); }
    .drawer-btns {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 8px;
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .footer-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.18); }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-ghost { color: var(--muted); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(34, 197, 94, 0.92);
      color: #052e16;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body class="page-mode">
  <div id="pip-placeholder" style="display:none; text-align:center; color:#94a3b8; max-width:340px;">
    <h3 style="color:#f3f5fa; margin:0 0 8px;">ClipQueue is floating on top</h3>
    <p style="font-size:13px; margin:0 0 14px;">Close the floating window or click below to bring it back into this tab.</p>
    <button class="btn btn-primary" onclick="closePip()">Return to Tab</button>
  </div>

  <div id="app" class="app-shell">
    <header class="header">
      <div class="header-left">
        <span class="dot" title="Ready"></span>
        <span class="title">ClipQueue</span>
        <span id="countPill" class="count-pill">0</span>
        <span id="miniPreview" class="mini-preview" title="Click to copy next item"></span>
      </div>
      <div class="header-actions">
        <button id="btnAutoRemove" class="icon-btn active" title="Auto-remove item after copying: ON">Auto-Clear</button>
        <button id="btnPip" class="icon-btn" title="Pop out into Always-on-Top window (Edge/Chrome)">Float ↗</button>
        <button id="btnCompact" class="icon-btn" title="Collapse to Mini Pill">▲</button>
      </div>
    </header>

    <main id="queueBody" class="body"></main>

    <section id="addDrawer" class="add-drawer">
      <textarea id="txtInput" placeholder="Type or paste text... (Ctrl+Enter to save)"></textarea>
      <div class="drawer-btns">
        <button id="btnCancel" class="btn btn-ghost">Cancel</button>
        <button id="btnSave" class="btn btn-primary">Save</button>
      </div>
    </section>

    <footer class="footer">
      <div class="footer-group">
        <button id="btnPasteIn" class="btn" title="Grab current system clipboard into queue">+ Paste Clip</button>
        <button id="btnAdd" class="btn">+ Add</button>
        <button id="btnClear" class="btn btn-ghost">Clear</button>
      </div>
      <button id="btnCopyNext" class="btn btn-primary">Copy Next →</button>
    </footer>
  </div>

  <div id="toast" class="toast">Copied!</div>

  <script>
    const STORAGE_KEY = 'clipqueue_web_items_v1';
    let items = [];
    let activeIndex = 0;
    let autoRemove = true;
    let editingId = null;
    let dragSrcIndex = null;
    let pipWindow = null;

    const appEl = document.getElementById('app');
    const bodyEl = document.getElementById('queueBody');
    const countPill = document.getElementById('countPill');
    const miniPreview = document.getElementById('miniPreview');
    const addDrawer = document.getElementById('addDrawer');
    const txtInput = document.getElementById('txtInput');
    const btnPip = document.getElementById('btnPip');
    const btnCompact = document.getElementById('btnCompact');
    const btnAutoRemove = document.getElementById('btnAutoRemove');
    const pipPlaceholder = document.getElementById('pip-placeholder');

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(saved)) items = saved;
      } catch {}
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
    }

    function showToast(msg) {
      const targetDoc = pipWindow ? pipWindow.document : document;
      let t = targetDoc.getElementById('toast');
      if (!t) {
        t = targetDoc.createElement('div');
        t.id = 'toast';
        t.className = 'toast';
        targetDoc.body.appendChild(t);
      }
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 1200);
    }

    function cleanPreview(str) {
      return (str || '').replace(/\r?\n/g, ' ').trim();
    }

    function render() {
      if (items.length === 0) {
        activeIndex = 0;
        countPill.textContent = '0';
        miniPreview.textContent = '';
        bodyEl.innerHTML = `<div class="empty">Queue is empty.<br/>Press <strong>Ctrl+V</strong> here, click <strong>+ Paste Clip</strong>, or click <strong>+ Add</strong>.</div>`;
        return;
      }
      if (activeIndex >= items.length) activeIndex = 0;
      countPill.textContent = `${activeIndex + 1}/${items.length}`;
      miniPreview.textContent = cleanPreview(items[activeIndex].text);

      bodyEl.innerHTML = '';
      items.forEach((item, idx) => {
        const isActive = idx === activeIndex;
        const card = document.createElement('div');
        card.className = 'card' + (isActive ? ' active' : '');
        card.draggable = true;

        card.innerHTML = `
          <span class="card-num">${idx + 1}.</span>
          <span class="card-text"></span>
          ${isActive ? '<span class="next-badge">NEXT</span>' : ''}
          <span class="card-actions">
            <button class="mini-btn edit" title="Edit">✎</button>
            <button class="mini-btn del" title="Delete">✕</button>
          </span>
        `;
        card.querySelector('.card-text').textContent = cleanPreview(item.text);

        card.addEventListener('click', (e) => {
          if (e.target.closest('.mini-btn')) return;
          copyItemAt(idx);
        });
        card.addEventListener('dblclick', (e) => {
          if (e.target.closest('.mini-btn')) return;
          openDrawer(item.id);
        });
        card.querySelector('.edit').addEventListener('click', (e) => {
          e.stopPropagation();
          openDrawer(item.id);
        });
        card.querySelector('.del').addEventListener('click', (e) => {
          e.stopPropagation();
          items.splice(idx, 1);
          if (activeIndex >= items.length) activeIndex = Math.max(0, items.length - 1);
          saveState();
          render();
        });

        // Drag & drop reorder
        card.addEventListener('dragstart', () => {
          dragSrcIndex = idx;
          card.classList.add('dragging');
        });
        card.addEventListener('dragend', () => card.classList.remove('dragging'));
        card.addEventListener('dragover', (e) => e.preventDefault());
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          if (dragSrcIndex === null || dragSrcIndex === idx) return;
          const activeId = items[activeIndex]?.id;
          const [moved] = items.splice(dragSrcIndex, 1);
          items.splice(idx, 0, moved);
          activeIndex = Math.max(0, items.findIndex(x => x.id === activeId));
          dragSrcIndex = null;
          saveState();
          render();
        });

        bodyEl.appendChild(card);
      });
    }

    async function copyItemAt(idx) {
      if (idx < 0 || idx >= items.length) return;
      const text = items[idx].text;
      try {
        await navigator.clipboard.writeText(text);
        showToast(autoRemove ? 'Copied & cleared!' : 'Copied!');
        if (autoRemove) {
          items.splice(idx, 1);
          if (activeIndex >= items.length) activeIndex = 0;
        } else {
          activeIndex = (idx + 1) % items.length;
        }
        saveState();
        render();
      } catch {
        showToast('Clipboard blocked — click inside window first');
      }
    }

    function addItem(text) {
      const val = (text || '').trim();
      if (!val) return;
      items.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), text: val });
      saveState();
      render();
    }

    function openDrawer(id = null) {
      editingId = id;
      if (appEl.classList.contains('compact')) toggleCompact();
      const existing = id ? items.find(x => x.id === id) : null;
      txtInput.value = existing ? existing.text : '';
      addDrawer.classList.add('open');
      txtInput.focus();
    }

    function closeDrawer() {
      addDrawer.classList.remove('open');
      editingId = null;
    }

    function saveDrawer() {
      const val = txtInput.value.trim();
      if (!val) { closeDrawer(); return; }
      if (editingId) {
        const target = items.find(x => x.id === editingId);
        if (target) target.text = val;
      } else {
        addItem(val);
      }
      saveState();
      render();
      closeDrawer();
    }

    function toggleCompact() {
      const isCompact = appEl.classList.toggle('compact');
      btnCompact.textContent = isCompact ? '▼' : '▲';
      btnCompact.title = isCompact ? 'Expand Queue' : 'Collapse to Mini Pill';
      if (pipWindow) {
        try {
          pipWindow.resizeTo(pipWindow.outerWidth, isCompact ? 86 : 520);
        } catch {}
      }
    }

    async function togglePip() {
      if (pipWindow) {
        closePip();
        return;
      }
      if (!('documentPictureInPicture' in window)) {
        showToast('Always-on-top requires Edge or Chrome on desktop');
        return;
      }
      try {
        pipWindow = await window.documentPictureInPicture.requestWindow({
          width: 380,
          height: appEl.classList.contains('compact') ? 86 : 520
        });
        const styleCopy = document.getElementById('cq-styles').cloneNode(true);
        pipWindow.document.head.appendChild(styleCopy);
        pipWindow.document.body.className = 'pip-mode';
        pipWindow.document.body.appendChild(appEl);
        pipPlaceholder.style.display = 'block';
        btnPip.classList.add('active');
        btnPip.textContent = 'Docked ↙';

        pipWindow.addEventListener('pagehide', () => {
          document.body.appendChild(appEl);
          pipPlaceholder.style.display = 'none';
          btnPip.classList.remove('active');
          btnPip.textContent = 'Float ↗';
          pipWindow = null;
        });
      } catch (err) {
        showToast('Could not open floating window');
      }
    }

    function closePip() {
      if (pipWindow) pipWindow.close();
    }

    // Event bindings
    document.getElementById('btnAdd').addEventListener('click', () => openDrawer(null));
    document.getElementById('btnCancel').addEventListener('click', closeDrawer);
    document.getElementById('btnSave').addEventListener('click', saveDrawer);
    document.getElementById('btnClear').addEventListener('click', () => {
      items = [];
      activeIndex = 0;
      saveState();
      render();
    });
    document.getElementById('btnCopyNext').addEventListener('click', () => copyItemAt(activeIndex));
    miniPreview.addEventListener('click', () => copyItemAt(activeIndex));
    btnCompact.addEventListener('click', toggleCompact);
    btnPip.addEventListener('click', togglePip);

    btnAutoRemove.addEventListener('click', () => {
      autoRemove = !autoRemove;
      btnAutoRemove.classList.toggle('active', autoRemove);
      btnAutoRemove.title = `Auto-remove item after copying: ${autoRemove ? 'ON' : 'OFF'}`;
    });

    document.getElementById('btnPasteIn').addEventListener('click', async () => {
      try {
        const clip = await navigator.clipboard.readText();
        if (clip && clip.trim()) {
          addItem(clip);
          showToast('Added from clipboard!');
        } else {
          showToast('Clipboard has no text');
        }
      } catch {
        showToast('Press Ctrl+V directly inside ClipQueue');
      }
    });

    txtInput.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); saveDrawer(); }
      if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); }
    });

    // Global paste inside the web app adds directly to the queue
    window.addEventListener('paste', (e) => {
      if (e.target === txtInput) return;
      const text = e.clipboardData?.getData('text/plain');
      if (text && text.trim()) {
        e.preventDefault();
        addItem(text);
        showToast('Added to queue!');
      }
    });

    loadState();
    render();
  </script>
</body>
</html>
